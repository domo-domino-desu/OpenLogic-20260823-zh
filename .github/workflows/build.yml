name: Build LaTeX document
on:
  push:
  pull_request:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Restore TikZ illustration cache
        uses: actions/cache@v4
        with:
          path: tikz-cache
          key: >-
            tikz-${{ runner.os }}-texlive-latest-${{ hashFiles('assets/diagrams/*.tikz', 'assets/diagrams/cache-wrapper.tex') }}
      - name: Pull TeX Live image
        run: docker pull texlive/texlive:latest
      - name: Build missing TikZ illustrations
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/work"
          --workdir /work
          texlive/texlive:latest
          sh -lc 'make tikz-cache/.stamp TIKZ_JOBS="$(nproc)"'
      - name: Compile debug LaTeX document
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/work"
          --workdir /work
          texlive/texlive:latest
          latexmk -lualatex -file-line-error -halt-on-error
          -interaction=nonstopmode open-logic-debug.tex
      - name: Report debug build failure
        if: failure()
        run: |
          {
            echo '```text'
            tail -n 120 open-logic-debug.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload open-logic-debug.pdf
        uses: actions/upload-artifact@v6
        with:
          name: open-logic-debug.pdf
          path: open-logic-debug.pdf
      - name: Compile release LaTeX document
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/work"
          --workdir /work
          texlive/texlive:latest
          make TIKZ_JOBS="$(nproc)"
      - name: Upload open-logic-complete.pdf
        uses: actions/upload-artifact@v6
        with:
          name: open-logic-complete.pdf
          path: open-logic-complete.pdf
